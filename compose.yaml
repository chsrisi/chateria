services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chateria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chateria}
      POSTGRES_DB: ${POSTGRES_DB:-chateria}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chateria} -d ${POSTGRES_DB:-chateria}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      API_PORT: ${API_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgres://chateria:chateria@db:5432/chateria}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      MAX_MESSAGE_LENGTH: ${MAX_MESSAGE_LENGTH:-4000}
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${API_PORT:-3000}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    environment:
      WEB_PORT: ${WEB_PORT:-5173}
      API_PORT: ${API_PORT:-3000}
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_WS_URL: ${VITE_WS_URL:-}
    ports:
      - "${WEB_PORT:-5173}:${WEB_PORT:-5173}"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
