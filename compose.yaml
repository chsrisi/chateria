# Only the database runs in Docker now. The API lives inside the Chateria
# Server desktop app, and the chat UI is the Chateria Client desktop app.
services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chateria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chateria}
      POSTGRES_DB: ${POSTGRES_DB:-chateria}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images moved PGDATA to /var/lib/postgresql/18/docker and
      # expose /var/lib/postgresql as the volume, so mount the parent.
      #
      # This is a NEW volume: the old `postgres_data` holds PostgreSQL 16 data
      # from the pre-2.0 stack, mounted at .../postgresql/data. Reusing it here
      # makes 18 refuse to boot. That volume is left untouched -- run
      # `docker volume rm chateria_postgres_data` once you no longer want it.
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chateria} -d ${POSTGRES_DB:-chateria}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data_v18:
